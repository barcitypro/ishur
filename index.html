<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://kvdhdxcbxvmjnaezbtwx.supabase.co; connect-src https://kvdhdxcbxvmjnaezbtwx.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>אישור תיקונים · מחלקת בדק סיטי פרוייקטים</title>
<link rel="icon" type="image/png" href="icon.png?v=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="wrap approve">
  <section id="aLoading" class="center"><img class="logo-lg" src="logo.png?v=1" alt="סיטי פרוייקטים"><span>טוען…</span></section>

  <section id="aMsg" hidden>
    <div class="card">
      <img class="logo-lg" src="logo.png?v=1" alt="סיטי פרוייקטים">
      <h2 id="aMsgTitle"></h2>
      <p class="sub" id="aMsgText"></p>
    </div>
  </section>

  <section id="aMain" hidden>
    <header class="brand">
      <img class="logo" src="logo.png?v=1" alt="סיטי פרוייקטים">
      <div class="brand-text">
        <h1>אישור תיקונים</h1>
        <p class="sub">מחלקת בדק סיטי פרוייקטים</p>
      </div>
    </header>

    <div class="panel">
      <p class="lead" id="aHello"></p>
      <div class="rgrid" id="aCall"></div>
      <div id="aIssue"></div>
    </div>

    <div id="aItems"></div>

    <form class="panel" id="aForm" novalidate>
      <h2>אישור וחתימה</h2>
      <label class="f">שם מלא<input type="text" id="aName" autocomplete="name" maxlength="100"></label>
      <div class="sig">
        <div class="title">חתימה כללית על כל התיקונים</div>
        <canvas id="aPad" class="sigpad" aria-label="משטח חתימה כללית"></canvas>
        <div class="actions">
          <button class="btn small" type="button" id="aClear">ניקוי החתימה</button>
          <span class="stamp">אפשר לחתום ליד כל תיקון בנפרד, כאן על כולם יחד, או גם וגם.</span>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="aAgree"> <span>אני מאשר/ת שהתיקונים שחתמתי עליהם בוצעו.</span></label>
      <div class="err" id="aErr" hidden></div>
      <button class="btn primary" id="aSend" type="submit">אישור וחתימה</button>
      <p class="stamp" id="aExp"></p>
    </form>
  </section>
</div>
<script src="approve.js?v=1"></script>
</body>
</html>
